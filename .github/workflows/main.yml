name: Build Unsigned IPA (Force Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 必须递归拉取核心代码
          fetch-depth: 0

      - name: Setup Go Environment
        run: |
          # 绕过 go.sum 检查，直接在系统安装 Go
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          # 1. 准备构建工具
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          
          # 2. 进入核心子模块执行编译
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Remove Extensions (Crucial Fix)
        run: |
          # 🔴 关键修复：删除会导致签名报错的扩展组件
          # 这些组件在免签名构建时必定失败，必须剔除
          rm -rf Extension
          rm -rf IntentsExtension
          rm -rf WidgetExtension
          rm -rf FileProviderExtension
          rm -rf TVExtension

      - name: Build Xcode Project
        run: |
          # 强制不签名编译主程序
          xcodebuild -project SFI/SFI.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Package IPA
        run: |
          # 手动封装符合 TrollStore 标准的 IPA
          mkdir -p Payload
          cp -r build/SFI.xcarchive/Products/Applications/SFI.app Payload/
          zip -r sing-box-final.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-final.ipa
