name: Build SingBox 1.12.14 Stable (Java Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17 (Crucial Fix)
        # 🔴 修复 FATAL[0000] 报错：强制配置 gomobile 要求的 OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Native Compile 1.12.14 Core
        run: |
          # 1. 🟢 拉取 1.12.14 官方源码
          git clone --branch v1.12.14 --depth 1 https://github.com/SagerNet/sing-box.git official-repo
          
          # 2. 🟢 安装编译工具
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init
          
          # 3. 🟢 定位入口并编译 (有了 Java 17 之后，这一步才不会报错)
          CORE_DIR=$(find official-repo -name "apple" -type d | grep "cmd/apple" | head -n 1)
          cd "$CORE_DIR"
          go run . framework -v
          
          # 4. 🟢 搬运成果
          cd $GITHUB_WORKSPACE
          mkdir -p Library/sing-box
          find official-repo -name "*.xcframework" -exec cp -rf {} Library/sing-box/ \;

      - name: Xcode Build (Skip Signing)
        run: |
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Export IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14-stable.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-IPA
          path: sing-box-1.12.14-stable.ipa
