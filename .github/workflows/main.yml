name: Build SFI (Auto Path Version)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Environment
        run: |
          brew install go
          go install github.com/sagernet/gomobile@latest
          $(go env GOPATH)/bin/gomobile init

      - name: Build Framework
        run: |
          # 🔴 关键修复：自动寻找包含核心代码的目录，解决你之前的 go.sum 报错
          TARGET_DIR=$(find . -name "go.mod" -exec grep -l "sing-box" {} + | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          go run ./cmd/apple framework

      - name: Build IPA
        run: |
          # 自动定位项目文件并强制不签名编译
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          xcodebuild -project "$PROJ" -scheme SFI -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean archive -archivePath build/SFI.xcarchive
          
          mkdir -p Payload
          cp -r build/SFI.xcarchive/Products/Applications/*.app Payload/
          zip -r sing-box-latest.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-latest.ipa
