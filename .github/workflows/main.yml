name: Build SingBox 1.12.14 (Environment Resolved)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17 (Fix FATAL Error)
        # 🔴 核心修复 1：解决 gomobile 对 OpenJDK 17 的强制要求
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build 1.12.14 Core From Source
        run: |
          # 1. 🟢 克隆 1.12.14 源码
          git clone --branch v1.12.14 --depth 1 https://github.com/SagerNet/sing-box.git official-core
          
          # 2. 🟢 配置编译环境
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          # 3. 🔴 核心修复 2：在根目录执行编译，避免 "no main module" 错误
          # 我们不再 cd 进入子目录，而是告诉 go 编译器直接运行指定包
          cd official-core
          $(go env GOPATH)/bin/gomobile init
          
          # 既然你追求无漏洞稳定版，这里就是现场制造 1.12.14 内核
          go run ./cmd/apple framework -v
          
          # 4. 🟢 成果搬运
          cd $GITHUB_WORKSPACE
          mkdir -p Library/sing-box
          cp -rf official-core/*.xcframework Library/sing-box/

      - name: Xcode Build (TrollStore Ready)
        run: |
          # 移除干扰插件确保主程序编译成功
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 强制 Xcode 使用我们刚才生成的 1.12.14 内核
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Export IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14-stable.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-IPA
          path: sing-box-1.12.14-stable.ipa
