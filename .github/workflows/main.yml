name: Build Pure IPA for TrollStore
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 🔴 尝试拉取子模块
          fetch-depth: 0

      - name: Force Sync Core
        run: |
          # 🔴 核心修复：如果子模块文件夹是空的，强行手动下载
          if [ ! -d "Library/sing-box" ] || [ ! -f "Library/sing-box/go.mod" ]; then
            rm -rf Library/sing-box
            git clone --recursive https://github.com/SagerNet/sing-box.git Library/sing-box
          fi

      - name: Setup Go & Gomobile
        run: |
          brew install go
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init

      - name: Build Core Framework
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # 进入补全后的核心目录
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Build Xcode (Pure Mode)
        run: |
          # 🔴 剔除干扰：删除所有会导致签名报错的 Extension 文件夹
          find . -name "*Extension" -type d -exec rm -rf {} +
          
          # 使用你截图中的工程名 sing-box.xcodeproj
          # 彻底禁用签名，只产出纯净的 .app
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package for TrollStore
        run: |
          # 建立标准 Payload 结构
          mkdir -p Payload
          # 寻找生成的 .app 并存入
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: sing-box-trollstore.ipa
