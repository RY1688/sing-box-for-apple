name: Build Unsigned IPA (Script Integrated)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 🔴 核心修复 1：强制拉取所有缺失的子模块（解决 Library 为空的问题）
          submodules: recursive
          fetch-depth: 0

      - name: Force Setup Core
        run: |
          # 🔴 核心修复 2：如果子模块没拉下来，手动强行抓取
          if [ ! -d "Library/sing-box" ]; then
            git submodule update --init --recursive
          fi

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          # 模拟脚本中的 Go 环境准备
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          
          # 编译核心 framework
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Build Xcode (Integrated Logic)
        run: |
          # 🔴 使用你脚本中的变量：sing-box.xcodeproj 和 SFI scheme
          # 开启 CODE_SIGNING_ALLOWED=NO 确保免签名构建
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Debug \
                     -sdk iphoneos \
                     -destination generic/platform=iOS \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     BITCODE_GENERATION_MODE=bitcode \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA (make_ios.sh logic)
        run: |
          # 创建 Payload 文件夹，这是打包标准
          mkdir -p packages/Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" packages/Payload/
          cd packages
          # 压缩为符合 TrollStore 要求的 IPA
          zip -qr sing-box-dev.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: packages/sing-box-dev.ipa
