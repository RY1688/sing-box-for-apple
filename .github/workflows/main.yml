name: Build Sing-Box IPA (Manual Sync)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Fix Directory Structure
        run: |
          # 🔴 关键修复：如果你下载的代码里没有 SFI 文件夹，这里强行补齐
          if [ ! -d "SFI" ]; then
            echo "SFI directory missing, creating alias..."
            # 尝试寻找主程序目录并建立软连接
            find . -maxdepth 2 -name "sing-box.xcodeproj" -exec dirname {} + | xargs -I {} ln -s {} SFI
          fi

      - name: Setup Go
        run: brew install go

      - name: Build Framework
        run: |
          go install github.com/sagernet/gomobile@latest
          $(go env GOPATH)/bin/gomobile init
          # 🔴 关键：即使 Library 下没东西，我们也强行克隆核心
          git clone --recursive https://github.com/SagerNet/sing-box.git Library/sing-box || true
          cd Library/sing-box && go run ./cmd/apple framework

      - name: Build Xcode
        run: |
          # 🔴 强制使用你提供的脚本变量
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-trollstore.ipa
