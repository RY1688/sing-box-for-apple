name: Build Unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 必须深度拉取所有子模块，否则目录是空的
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # 🔴 关键修复：禁用缓存检查，解决 "go.sum not found" 报错
          cache: false 

      - name: Build Core Framework
        run: |
          # 手动安装构建工具
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          
          # 尝试直接运行 apple 核心构建脚本
          # 这步通常会自动处理内部路径
          go run ./cmd/apple framework

      - name: Build Xcode
        run: |
          # 强制不签名编译
          xcodebuild -project SFI.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Package IPA
        run: |
          # 手动封装 IPA
          mkdir -p Payload
          cp -r build/SFI.xcarchive/Products/Applications/SFI.app Payload/
          zip -r sing-box-dev.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-dev.ipa
