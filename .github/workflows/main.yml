name: Root Direct Build (No Path Error)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Go Environment
        run: |
          brew install go
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init

      - name: Build Core (Latest & Clean)
        run: |
          # 🔴 核心变动：直接在当前根目录下载最新内核源码
          git clone --depth 1 https://github.com/SagerNet/sing-box.git
          
          # 🔴 不使用 cd 进入文件夹，直接指定路径编译
          # 这样可以确保日志能输出到底在哪里报错
          ls -R sing-box/cmd/apple # 调试：强制列出目录结构确认文件存在
          
          # 执行编译最新内核
          go run ./sing-box/cmd/apple framework
          
          # 🔴 暴力移动：把生成的 xcframework 强制塞进项目每个可能的坑位
          mkdir -p Library/sing-box
          cp -rf *.xcframework Library/sing-box/ || true
          cp -rf sing-box/*.xcframework Library/sing-box/ || true

      - name: Xcode Build (No Sign)
        run: |
          # 彻底删除干扰项
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 强制指定在根目录寻找刚才生成的零件
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-latest.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-Latest-Build
          path: sing-box-latest.ipa
