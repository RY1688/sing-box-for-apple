name: Build SingBox 1.12.14 Final Victory
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Force Setup Environment (Java 17 & Go)
        # 🔴 解决冲突 1：强制降级 Java，满足 gomobile 严苛要求
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Core (Absolute Workspace Fix)
        run: |
          # 🔴 解决冲突 2：不再依赖相对路径，全部使用绝对变量
          WORK_DIR=$GITHUB_WORKSPACE
          export GOPROXY=https://proxy.golang.org,direct
          
          # 克隆 1.12.14 稳定版源码
          git clone --branch v1.12.14 --depth 1 https://github.com/SagerNet/sing-box.git $WORK_DIR/official-core
          
          # 安装编译工具
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init
          
          # 🔴 解决冲突 3：直接在源码根目录执行编译，防止找不到 Module
          cd $WORK_DIR/official-core
          go run ./cmd/apple framework -v
          
          # 🔴 解决冲突 4：强制物理对位，把生成的零件塞进项目
          mkdir -p $WORK_DIR/Library/sing-box
          cp -rf $WORK_DIR/official-core/*.xcframework $WORK_DIR/Library/sing-box/

      - name: Xcode Build (TrollStore Pure IPA)
        run: |
          # 彻底剔除不需要的插件
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 强制 Xcode 只看我们刚才生成的 1.12.14 内核
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Export & Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14-stable.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-Success
          path: sing-box-1.12.14-stable.ipa
