name: Build SFI (Third Party Logic)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-apple # 🔴 直接拉取官方仓库
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core
        run: |
          go install github.com/sagernet/gomobile@latest
          gomobile init
          # 🔴 关键：进入特定目录编译，避免根目录找不到文件的错误
          go run ./cmd/apple framework

      - name: Build Xcode
        run: |
          # 使用通配符寻找项目，防止路径变动
          xcodebuild -project **/*.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Export IPA
        run: |
          mkdir -p Payload
          cp -r build/SFI.xcarchive/Products/Applications/*.app Payload/
          zip -r sing-box-auto.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-auto.ipa
