name: Build Unsigned IPA (Success Version)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 🔴 强制递归拉取子模块
          submodules: recursive
          fetch-depth: 0

      - name: Force Fix Missing Core
        run: |
          # 🔴 如果子模块没拉下来，手动强行克隆核心代码到正确位置
          if [ ! -d "Library/sing-box" ] || [ ! -f "Library/sing-box/go.mod" ]; then
            echo "Core missing, force cloning..."
            rm -rf Library/sing-box
            git clone https://github.com/SagerNet/sing-box.git Library/sing-box
          fi

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          # 1. 安装构建工具
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          
          # 2. 🔴 进入核心代码所在的绝对路径进行编译
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Clean Project
        run: |
          # 🔴 剔除无法免签名编译的干扰插件 (Widget等)
          find . -name "*Extension" -type d -exec rm -rf {} +

      - name: Build Xcode
        run: |
          # 🔴 使用你截图中的最新工程名: sing-box.xcodeproj
          xcodebuild -project sing-box.xcodeproj \
                     -scheme sing-box \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          # 封装为 IPA
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-trollstore.ipa
