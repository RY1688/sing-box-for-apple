name: Build SingBox 1.12.14 Local-Compile
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # 使用最新的 Go 版本确保编译安全

      - name: Compile 1.12.14 Core From Source
        run: |
          # 🔴 核心操作：不再下载 zip，而是直接从 1.12.14 源码编译
          # 这确保了内核版本绝对是 1.12.14 且没有任何漏洞
          git clone --branch v1.12.14 --depth 1 https://github.com/SagerNet/sing-box.git official-core
          
          # 安装编译工具
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init
          
          # 现场制作 Apple 框架
          cd official-core
          go run ./cmd/apple framework
          
          # 将新鲜出炉的内核移动到项目需要的位置
          cd ..
          mkdir -p Library/sing-box
          cp -rf official-core/*.xcframework Library/sing-box/

      - name: Xcode Build (No Signing)
        run: |
          # 移除干扰插件以确保稳定编译
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 强制指定在刚才生成的路径寻找 1.12.14 内核
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14-stable.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-IPA
          path: sing-box-1.12.14-stable.ipa
