name: Final Force Build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # 强制拉取子模块
          fetch-depth: 0

      - name: Setup Go
        run: brew install go

      - name: Build Core
        run: |
          go install github.com/sagernet/gomobile@latest
          $(go env GOPATH)/bin/gomobile init
          # 🔴 关键：直接指定绝对路径去运行构建命令
          go run ./cmd/apple framework 

      - name: Build Xcode
        run: |
          # 🔴 关键：明确告诉 Xcode 工程文件在哪里
          xcodebuild -project SFI/SFI.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     archive -archivePath build/SFI.xcarchive

      - name: Export
        run: |
          mkdir -p Payload
          cp -r build/SFI.xcarchive/Products/Applications/SFI.app Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ipa-package
          path: sing-box-trollstore.ipa
