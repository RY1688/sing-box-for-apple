name: Build Unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Manual Setup Go
        run: |
          # 🔴 关键修复：直接用 brew 安装 Go，绕过官方 Action 的 go.sum 检查
          brew install go
          echo "GOROOT=$(brew --prefix go)/libexec" >> $GITHUB_ENV
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          # 1. 准备环境
          export PATH=$PATH:$(go env GOPATH)/bin
          go install github.com/sagernet/gomobile@latest
          gomobile init
          
          # 2. 尝试编译核心
          # 如果直接运行失败，脚本会尝试进入子目录运行
          go run ./cmd/apple framework || (cd $(find . -name "go.mod" -exec dirname {} + | head -n 1) && go run ./cmd/apple framework)

      - name: Build Xcode
        run: |
          # 自动寻找并编译项目
          PROJ_FILE=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          xcodebuild -project "$PROJ_FILE" \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find build/SFI.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_DIR" Payload/
          zip -r sing-box-dev.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-dev.ipa
