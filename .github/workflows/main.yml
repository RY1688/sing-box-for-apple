name: Build SingBox 1.12.14 Stable-Final-v5
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Compile 1.12.14 Core (Module Environment Fix)
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          
          # 1. 抓取 v1.12.14 源码
          git clone --branch v1.12.14 --depth 1 https://github.com/SagerNet/sing-box.git official-core
          
          # 2. 安装 gomobile 工具
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init
          
          # 3. 动态定位并准备环境
          REAL_PATH=$(find $GITHUB_WORKSPACE/official-core -name "apple" -type d | grep "cmd/apple" | head -n 1)
          echo "Found entry point at: $REAL_PATH"
          
          # 🔴 关键修复：在入口目录强制关联根目录的模块
          cd "$REAL_PATH"
          if [ ! -f "go.mod" ]; then
            echo "Initializing temporary module context..."
            # 链接回根目录的依赖，确保编译能找到所有包
            go mod init github.com/sagernet/sing-box/cmd/apple || true
            go mod tidy || true
          fi
          
          # 4. 执行编译 (使用全路径确保引用正确)
          go run . framework -v
          
          # 5. 搬运生成的框架
          cd $GITHUB_WORKSPACE
          mkdir -p Library/sing-box
          find official-core -name "*.xcframework" -exec cp -rf {} Library/sing-box/ \;

      - name: Xcode Build (No Signing)
        run: |
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14-stable.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-IPA
          path: sing-box-1.12.14-stable.ipa
