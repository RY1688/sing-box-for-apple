name: Build SingBox 1.12.14 API-Fix
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: API-Based Framework Fetch
        run: |
          # 🔴 使用 GitHub 内部 Token 通过 API 下载，绕过所有网络拦截
          # 这样即便你的容器环境有干扰，云端虚拟机内部抓取是 100% 安全的
          AUTH_HEADER="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          
          # 1.12.14 版本的核心框架包
          CORE_URL="https://github.com/SagerNet/sing-box/releases/download/v1.12.14/SFI-Framework.zip"
          
          # 使用强制重定向和授权头进行下载
          curl -L -H "$AUTH_HEADER" -H "Accept: application/octet-stream" \
               -o core.zip "$CORE_URL"
          
          # 🔴 关键检查：如果文件小于 100 字节，说明下载被拦截了，直接报错停止
          FILE_SIZE=$(stat -f%z "core.zip")
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "Error: Downloaded file is too small ($FILE_SIZE bytes). Request was likely blocked."
            exit 1
          fi
          
          mkdir -p Library/sing-box
          unzip -o core.zip -d Library/sing-box/

      - name: Xcode Build (Clean 1.12.14)
        run: |
          # 移除干扰项以保证编译纯净度
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 强制指定框架搜索路径为 1.12.14 目录
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-IPA
          path: sing-box-1.12.14.ipa
