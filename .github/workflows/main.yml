name: Final SingBox Build
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 🔴 尝试自动拉取
          fetch-depth: 0

      - name: Force Fix Missing Core
        run: |
          # 🔴 核心修复：如果子模块文件夹是空的，强行手动补全
          if [ ! -d "Library/sing-box" ] || [ ! -f "Library/sing-box/go.mod" ]; then
            echo "Core missing, downloading..."
            rm -rf Library/sing-box
            git clone --recursive https://github.com/SagerNet/sing-box.git Library/sing-box
          fi

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core
        run: |
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          # 进入刚才补全的核心目录进行编译
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Build Xcode
        run: |
          # 🔴 删除干扰组件，使用你提供的 sing-box.xcodeproj
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package
        run: |
          mkdir -p Payload
          cp -rp build/sing-box.xcarchive/Products/Applications/*.app Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ipa-file
          path: sing-box-trollstore.ipa
