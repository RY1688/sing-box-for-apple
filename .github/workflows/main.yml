name: Build Unsigned IPA (Submodule Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Main Code
        uses: actions/checkout@v4
        with:
          # 🔴 关键修复：显式要求递归拉取所有缺失的子模块
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go Environment
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Force Init Submodules (Double Check)
        run: |
          # 🔴 关键修复：如果 Checkout 没拉全，这里强制再拉一次
          git submodule update --init --recursive

      - name: Build Core Framework
        run: |
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          
          # 🔴 关键修复：进入正确的子模块目录（现在它不再是空的了）
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Clean Extensions
        run: |
          # 删除所有无证书无法编译的扩展
          rm -rf Extension FileProviderExtension IntentsExtension TVExtension WidgetExtension SystemExtension SFM.System

      - name: Build Xcode Project
        run: |
          # 使用你截图中的最新工程名
          xcodebuild -project sing-box.xcodeproj \
                     -scheme sing-box \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-trollstore.ipa
