name: Build Unsigned IPA (Force)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Manual Environment Setup
        run: |
          # 1. 强行在系统级别安装 Go，不使用任何 Action 插件
          brew install go
          # 2. 设置 Go 环境变量
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          # 3. 立即安装 gomobile 工具
          go install github.com/sagernet/gomobile@latest
          $(go env GOPATH)/bin/gomobile init

      - name: Compile Sing-Box Core
        run: |
          # 自动寻找包含 go.mod 的目录并进入
          CORE_DIR=$(find . -name "go.mod" -exec dirname {} + | head -n 1)
          cd "$CORE_DIR"
          # 编译核心框架
          go run ./cmd/apple framework

      - name: Compile Xcode Project
        run: |
          # 寻找项目文件
          PROJ_FILE=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          # 强行构建存档（禁用所有签名要求）
          xcodebuild -project "$PROJ_FILE" \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     BITCODE_GENERATION_MODE=bitcode \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Final IPA Packaging
        run: |
          # 手动封装符合 TrollStore 要求的 IPA
          mkdir -p Payload
          APP_DIR=$(find build/SFI.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_DIR" Payload/
          zip -r sing-box-final.ipa Payload/

      - name: Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-final.ipa
