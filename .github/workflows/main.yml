name: Build Unsigned IPA (New Version Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 🔴 必须：确保 Library 文件夹内有代码
          fetch-depth: 0

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          
          # 🔴 核心修复 1：进入子模块目录编译核心
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Clean Extensions
        run: |
          # 🔴 核心修复 2：强行删除所有会导致签名报错的扩展模块
          # 只要这些文件夹存在，无签名构建就一定会报 Exit Code 1
          rm -rf Extension FileProviderExtension IntentsExtension TVExtension WidgetExtension SystemExtension SFM.System

      - name: Build Xcode Project
        run: |
          # 🔴 核心修复 3：使用你截图中的新工程名 sing-box.xcodeproj
          xcodebuild -project sing-box.xcodeproj \
                     -scheme sing-box \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          # 封装为 IPA
          mkdir -p Payload
          # 自动定位生成的 .app 文件
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-trollstore.ipa
