name: Build Unsigned IPA (Submodule Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 🔴 核心修复 1：强制拉取那个“带箭头”的 sing-box 文件夹
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          # 1. 安装构建工具
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          
          # 2. 🔴 核心修复 2：进入那个之前是“空壳”的目录执行编译
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Clean Extensions
        run: |
          # 🔴 核心修复 3：删除所有会导致签名报错的干扰模块
          rm -rf Extension FileProviderExtension IntentsExtension TVExtension WidgetExtension SystemExtension SFM.System

      - name: Build Xcode Project
        run: |
          # 🔴 使用你截图中最新的工程名
          xcodebuild -project sing-box.xcodeproj \
                     -scheme sing-box \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-trollstore.ipa
