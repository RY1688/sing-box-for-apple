name: Build Unsigned IPA (Success Version)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 🔴 核心修复 1：递归拉取子模块
          submodules: recursive
          fetch-depth: 0

      - name: Force Fix Submodule
        run: |
          # 🔴 核心修复 2：如果目录还是空的，手动强行抓取核心代码
          if [ ! -f "Library/sing-box/go.mod" ]; then
            echo "Submodule missing, fixing..."
            git submodule update --init --recursive
          fi

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          # 1. 安装工具
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          
          # 2. 🔴 核心修复 3：直接进入核心代码所在的绝对路径
          # 根据你的截图，核心代码必须在 Library/sing-box 下
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Clean Project
        run: |
          # 🔴 核心修复 4：剔除无法免签名编译的干扰项
          find . -name "*Extension" -type d -exec rm -rf {} +

      - name: Build Xcode
        run: |
          # 使用你截图中的最新工程名
          xcodebuild -project sing-box.xcodeproj \
                     -scheme sing-box \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-trollstore.ipa
