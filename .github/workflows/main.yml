name: Ultimate SingBox Build (Core Fixed)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Fix Missing Core
        run: |
          # 🔴 关键修复：如果 Library 里的核心代码文件夹是空的，强行手动下载最新内核
          if [ ! -f "Library/sing-box/go.mod" ]; then
            echo "Detecting missing core, force cloning..."
            rm -rf Library/sing-box
            git clone --recursive https://github.com/SagerNet/sing-box.git Library/sing-box
          fi

      - name: Setup Go & Gomobile
        run: |
          brew install go
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init

      - name: Build Core Framework
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd Library/sing-box
          # 这里会根据最新的官方代码编译内核框架
          go run ./cmd/apple framework

      - name: Build Xcode (No Signing)
        run: |
          # 删除干扰项，避免证书报错
          find . -name "*Extension" -type d -exec rm -rf {} +
          
          # 强制指定你截图中的工程名
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package for TrollStore
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-latest.ipa Payload/

      - name: Upload Latest IPA
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-Latest-Build
          path: sing-box-latest.ipa
