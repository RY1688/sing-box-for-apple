name: Final Build SingBox 1.12.14 Stable
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Inject 1.12.14 Core Framework
        run: |
          # 🔴 直接拉取官方为 iOS 准备的 1.12.14 核心零件
          curl -L -o core.zip https://github.com/SagerNet/sing-box/releases/download/v1.12.14/SFI-Framework.zip
          
          # 强制创建目标零件坑位
          mkdir -p Library/sing-box
          unzip -o core.zip -d Library/sing-box/
          
          # 🔴 关键验证：如果这一步列出了 xcframework，就说明零件已到位
          ls -R Library/sing-box

      - name: Xcode Build (TrollStore Compatible)
        run: |
          # 移除导致证书报错的干扰项
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 强制 Xcode 使用我们刚才注入的 1.12.14 核心
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Export IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-IPA
          path: sing-box-1.12.14.ipa
