name: Build Unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Core
        run: |
          go install github.com/sagernet/gomobile@latest
          gomobile init
          # 编译 Go 核心框架
          go run ./cmd/apple framework

      - name: Build Xcode
        run: |
          # 强制不签名编译
          xcodebuild -project SFI.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Package IPA
        run: |
          # 手动封装 IPA 结构
          mkdir -p Payload
          cp -r build/SFI.xcarchive/Products/Applications/SFI.app Payload/
          zip -r sing-box-dev.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-dev.ipa
