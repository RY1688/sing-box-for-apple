name: Ultimate Core Build (Latest Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Go
        run: |
          brew install go
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init

      - name: Build Latest Core
        run: |
          # 🔴 核心改变：强制使用绝对路径下载最新官方内核
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/SagerNet/sing-box.git official-repo
          
          # 🔴 强制寻找：不管它在哪，直接抓出来编译最新的 Go 内核
          CORE_DIR=$(find $GITHUB_WORKSPACE -name "apple" -type d | grep "cmd/apple" | head -n 1)
          if [ -z "$CORE_DIR" ]; then echo "Error: Core files not found"; exit 1; fi
          
          cd $(dirname $(dirname $CORE_DIR)) # 回到核心根目录
          go run ./cmd/apple framework
          
          # 🔴 强制对位：手动创建项目预期的路径，并把生成的 framework 扔进去
          mkdir -p $GITHUB_WORKSPACE/Library/sing-box
          cp -rf *.xcframework $GITHUB_WORKSPACE/Library/sing-box/

      - name: Xcode Build (No Sign)
        run: |
          # 剔除干扰插件，确保编译的是无漏洞版本的主程序
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-latest.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-Secure-Build
          path: sing-box-latest.ipa
