name: Manual Core Sync Build
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Force Download Latest Core
        run: |
          # 🔴 暴力修复：不等 Git 自动同步，直接手动下载官方最新的 Go 内核
          # 这样就能确保你编译的是最新版，没有任何漏洞
          mkdir -p Library
          rm -rf Library/sing-box
          git clone --depth 1 --recursive https://github.com/SagerNet/sing-box.git Library/sing-box
          
      - name: Setup Go & Mobile
        run: |
          brew install go
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init

      - name: Build Core
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # 既然你追求最新，这里就是直接编译刚才抓取的最新源码
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Build Xcode (Pure IPA)
        run: |
          # 彻底剔除不需要的扩展，防止签名报错
          find . -name "*Extension" -type d -exec rm -rf {} +
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Export IPA
        run: |
          mkdir -p Payload
          cp -rp build/sing-box.xcarchive/Products/Applications/*.app Payload/
          zip -r sing-box-latest.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Latest-SingBox-IPA
          path: sing-box-latest.ipa
