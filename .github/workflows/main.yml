name: Build Unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Core Framework
        run: |
          # 1. 安装构建工具
          go install github.com/sagernet/gomobile@latest
          gomobile init
          # 2. 尝试执行项目自带的构建脚本
          if [ -f "make" ]; then
            make framework
          else
            go run ./cmd/apple framework
          fi

      - name: Build Xcode
        run: |
          # 自动定位 .xcodeproj 文件位置
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          SCHEME_NAME="SFI"
          
          echo "Using Project: $PROJECT_PATH"
          
          xcodebuild -project "$PROJECT_PATH" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     BITCODE_GENERATION_MODE=bitcode \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Package IPA
        run: |
          # 寻找编译出的 .app 文件并封装
          APP_PATH=$(find build/SFI.xcarchive -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r sing-box-latest.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-latest.ipa
