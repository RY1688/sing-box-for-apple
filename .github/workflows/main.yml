name: Build Sing-Box IPA (Manual Core Sync)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 🔴 强制拉取子模块
          submodules: recursive
          fetch-depth: 0

      - name: Force Download Missing Core
        run: |
          # 🔴 核心修复：如果 Library 里的核心代码文件夹是空的，强行手动下载
          if [ ! -d "Library/sing-box" ] || [ ! -f "Library/sing-box/go.mod" ]; then
            echo "Core components missing, force downloading..."
            rm -rf Library/sing-box
            git clone --recursive https://github.com/SagerNet/sing-box.git Library/sing-box
          fi

      - name: Setup Go
        run: |
          brew install go
          echo "$(brew --prefix go)/bin" >> $GITHUB_PATH

      - name: Build Core Framework
        run: |
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          $(go env GOPATH)/bin/gomobile init
          # 进入补全后的核心目录进行编译
          cd Library/sing-box
          go run ./cmd/apple framework

      - name: Build Xcode (Using your script logic)
        run: |
          # 🔴 核心修复：移除所有干扰插件，只编主程序
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 执行编译 (参考你的 make_ios.sh 变量)
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -destination generic/platform=iOS \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean build install \
                     DSTROOT=packages/

      - name: Package IPA
        run: |
          mkdir -p packages/Payload
          APP_DIR=$(find packages/Applications -name "*.app" | head -n 1)
          cp -rp "$APP_DIR" packages/Payload/
          cd packages
          zip -qr sing-box-trollstore.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: packages/sing-box-trollstore.ipa
