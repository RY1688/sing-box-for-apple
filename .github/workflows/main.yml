name: Secure Build (Final Path Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go & Tools
        run: |
          brew install go
          # 🔴 使用正确的安装路径
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init

      - name: Build Core (Direct Source)
        run: |
          # 🔴 不再使用 Library 目录，直接在根目录下载最新官方内核
          git clone --depth 1 https://github.com/SagerNet/sing-box.git official-core
          cd official-core
          
          # 编译最新的 Go 核心框架
          go run ./cmd/apple framework
          
          # 🔴 关键对位：手动创建项目预期的路径，并把生成的 framework 扔进去
          cd ..
          mkdir -p Library/sing-box
          cp -rf official-core/*.xcframework Library/sing-box/
          # 同时拷贝必要头文件以防 Xcode 找不到定义
          cp -rf official-core/apple Library/sing-box/ || true

      - name: Xcode Build (Skip Signing)
        run: |
          # 剔除干扰插件，只留核心 SFI
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 编译 IPA，彻底禁用签名
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package for TrollStore
        run: |
          mkdir -p Payload
          # 寻找生成的 .app 并存入 Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-latest.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-Latest-Secure
          path: sing-box-latest.ipa
