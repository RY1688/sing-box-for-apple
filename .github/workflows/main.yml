name: Build SingBox 1.12.14 Stable-Final-v6
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Compile 1.12.14 Core (Explicit Path Fix)
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          
          # 1. 下载 v1.12.14 源码
          git clone --branch v1.12.14 --depth 1 https://github.com/SagerNet/sing-box.git official-core
          
          # 2. 安装并初始化 gomobile
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init
          
          # 3. 🔴 关键修复：不再使用 cd，而是直接告诉 gomobile 执行官方的构建脚本
          # 在 1.12.14 中，构建逻辑由 cmd/apple/main.go 处理
          cd official-core
          
          # 运行官方提供的苹果端构建命令，生成 .xcframework
          go run ./cmd/apple framework -v
          
          # 4. 搬运生成的框架到 Xcode 预期的位置
          cd $GITHUB_WORKSPACE
          mkdir -p Library/sing-box
          find official-core -name "*.xcframework" -exec cp -rf {} Library/sing-box/ \;

      - name: Xcode Build (No Signing)
        run: |
          # 移除干扰插件以确保稳定
          rm -rf Extension IntentsExtension WidgetExtension TVExtension
          
          # 强制在 Library/sing-box 寻找刚才编译好的 1.12.14 内核
          xcodebuild -project sing-box.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     FRAMEWORK_SEARCH_PATHS="$(pwd)/Library/sing-box" \
                     clean archive -archivePath build/sing-box.xcarchive

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/sing-box.xcarchive -name "*.app" | head -n 1)
          cp -rp "$APP_PATH" Payload/
          zip -r sing-box-1.12.14-stable.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-1.12.14-IPA
          path: sing-box-1.12.14-stable.ipa
