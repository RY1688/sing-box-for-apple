name: Build Unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 🔴 关键修复 1：必须深度递归拉取所有子模块核心代码
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 🔴 关键修复 2：禁用自动缓存，防止因找不到 go.sum 报错
          go-version: '1.23'
          cache: false 

      - name: Build Core Framework
        run: |
          # 强制安装 gomobile 工具
          go install github.com/sagernet/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          
          # 🔴 关键修复 3：直接调用项目封装好的 apple 构建命令
          # 这会自动处理路径问题
          go run ./cmd/apple framework

      - name: Build Xcode
        run: |
          # 强制不签名编译
          xcodebuild -project SFI.xcodeproj \
                     -scheme SFI \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive -archivePath build/SFI.xcarchive

      - name: Package IPA
        run: |
          # 封装为 IPA
          mkdir -p Payload
          cp -r build/SFI.xcarchive/Products/Applications/SFI.app Payload/
          zip -r sing-box-dev.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ipa
          path: sing-box-dev.ipa
